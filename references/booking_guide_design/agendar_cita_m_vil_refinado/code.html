<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Agendar Cita - L'Aura Ivory</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-bright": "#fbf9f5",
              "surface-container-low": "#f5f3ef",
              "primary-container": "#e49f53",
              "on-background": "#1b1c1a",
              "on-tertiary-container": "#42413f",
              "on-tertiary": "#ffffff",
              "on-surface-variant": "#524438",
              "error": "#ba1a1a",
              "secondary-fixed-dim": "#cdc5c0",
              "surface-tint": "#885208",
              "on-secondary-fixed": "#1e1b18",
              "surface-container-lowest": "#ffffff",
              "surface-container-high": "#eae8e4",
              "secondary-container": "#e6ded9",
              "on-secondary-container": "#67625e",
              "inverse-on-surface": "#f2f0ed",
              "tertiary-fixed": "#e5e2df",
              "outline": "#847466",
              "outline-variant": "#d6c3b3",
              "on-primary": "#ffffff",
              "primary": "#885208",
              "on-tertiary-fixed": "#1c1b1a",
              "on-error-container": "#93000a",
              "on-primary-fixed": "#2c1600",
              "error-container": "#ffdad6",
              "primary-fixed-dim": "#ffb86c",
              "on-tertiary-fixed-variant": "#484745",
              "on-secondary": "#ffffff",
              "on-error": "#ffffff",
              "surface-container-highest": "#e4e2de",
              "on-surface": "#1b1c1a",
              "surface-container": "#efeeea",
              "secondary": "#635d5a",
              "inverse-surface": "#30312e",
              "surface": "#fbf9f5",
              "tertiary-fixed-dim": "#c9c6c3",
              "tertiary-container": "#b0adaa",
              "primary-fixed": "#ffdcbc",
              "surface-dim": "#dbdad6",
              "secondary-fixed": "#e9e1dc",
              "on-secondary-fixed-variant": "#4b4642",
              "on-primary-fixed-variant": "#683c00",
              "on-primary-container": "#603700",
              "tertiary": "#605e5c",
              "inverse-primary": "#ffb86c",
              "surface-variant": "#e4e2de",
              "background": "#fbf9f5"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-[#fbf9f5] text-on-surface min-h-screen flex flex-col">
<!-- Top Header / Navigation -->
<header class="w-full flex items-center justify-between px-6 pt-10 pb-6">
<button class="active:scale-95 duration-150 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary">close</span>
</button>
<div class="flex-grow text-center">
<h1 class="font-bold text-xl text-[#2d2926]">Agendar Cita</h1>
</div>
<div class="w-10"></div>
</header>
<!-- Main Form Content -->
<main class="flex-grow px-8 pb-10 max-w-md mx-auto w-full">
<!-- Step Indicator & Header Group -->
<div class="mb-8">
<div class="flex justify-between items-start mb-2">
<div>
<span class="text-[10px] font-bold uppercase tracking-[0.2em] text-[#e49f53]">Paso 1 de 2</span>
<h2 class="text-4xl font-bold text-on-surface mt-1">Agendar cita</h2>
</div>
<div class="w-12 h-12 rounded-full border border-outline-variant/30 flex items-center justify-center bg-white shadow-sm">
<span class="material-symbols-outlined text-[#e49f53] font-light">calendar_today</span>
</div>
</div>
<div class="w-full h-[2px] bg-surface-container-high rounded-full overflow-hidden">
<div class="w-1/2 h-full bg-[#e49f53]"></div>
</div>
</div>
<!-- Date Selection Section -->
<section class="mb-10">
<div class="flex justify-between items-baseline mb-5">
<h3 class="text-[11px] font-bold tracking-[0.2em] text-outline uppercase">Días Disponibles</h3>
<span class="text-sm font-medium text-on-surface">Agosto de 2026</span>
</div>
<div class="flex gap-4 overflow-x-auto no-scrollbar py-2">
<!-- Day Item Active -->
<div class="flex-shrink-0 w-[72px] h-[96px] flex flex-col items-center justify-center rounded-[32px] bg-[#e49f53] text-white shadow-xl shadow-primary-container/20 active:scale-95 transition-transform">
<span class="text-[10px] font-bold uppercase opacity-80 mb-1">LUN</span>
<span class="text-2xl font-bold">03</span>
</div>
<!-- Day Item Inactive -->
<div class="flex-shrink-0 w-[72px] h-[96px] flex flex-col items-center justify-center rounded-[32px] bg-white border border-outline-variant/30 text-on-surface active:scale-95 transition-transform">
<span class="text-[10px] font-bold uppercase text-outline mb-1">MAR</span>
<span class="text-2xl font-bold">04</span>
</div>
<div class="flex-shrink-0 w-[72px] h-[96px] flex flex-col items-center justify-center rounded-[32px] bg-white border border-outline-variant/30 text-on-surface active:scale-95 transition-transform">
<span class="text-[10px] font-bold uppercase text-outline mb-1">MIÉ</span>
<span class="text-2xl font-bold">05</span>
</div>
<div class="flex-shrink-0 w-[72px] h-[96px] flex flex-col items-center justify-center rounded-[32px] bg-white border border-outline-variant/30 text-on-surface active:scale-95 transition-transform">
<span class="text-[10px] font-bold uppercase text-outline mb-1">JUE</span>
<span class="text-2xl font-bold">06</span>
</div>
</div>
</section>
<!-- Time Selection Section -->
<section class="mb-10">
<h3 class="text-[11px] font-bold tracking-[0.2em] text-outline uppercase mb-5">Selecciona tu horario</h3>
<div class="grid grid-cols-2 gap-4">
<!-- Selected State -->
<button class="py-5 px-4 rounded-full bg-[#e49f53] text-white font-bold text-sm shadow-lg shadow-primary-container/10 active:scale-95 transition-all">
                09:00 AM
            </button>
<button class="py-5 px-4 rounded-full border border-outline-variant/30 bg-white text-on-surface font-medium text-sm active:scale-95 transition-all">
                10:00 AM
            </button>
<button class="py-5 px-4 rounded-full border border-outline-variant/30 bg-white text-on-surface font-medium text-sm active:scale-95 transition-all">
                01:00 PM
            </button>
<button class="py-5 px-4 rounded-full border border-outline-variant/30 bg-white text-on-surface font-medium text-sm active:scale-95 transition-all">
                02:00 PM
            </button>
<button class="py-5 px-4 rounded-full border border-outline-variant/30 bg-white text-on-surface font-medium text-sm active:scale-95 transition-all">
                05:00 PM
            </button>
<button class="py-5 px-4 rounded-full border border-outline-variant/30 bg-white text-on-surface font-medium text-sm active:scale-95 transition-all">
                06:00 PM
            </button>
</div>
</section>
<!-- Customer Information Section -->
<section class="mb-12">
<h3 class="text-[11px] font-bold tracking-[0.2em] text-outline uppercase mb-5">Tus datos</h3>
<div class="space-y-6">
<div class="relative">
<label class="absolute -top-2 left-6 bg-[#fbf9f5] px-2 text-[10px] font-bold tracking-wider text-[#e49f53] uppercase">Teléfono</label>
<input class="w-full bg-white border border-outline-variant/30 rounded-full px-8 py-5 text-on-surface focus:ring-1 focus:ring-primary-container focus:border-primary-container outline-none transition-all placeholder:text-outline-variant" placeholder="322 123 4567" type="tel"/>
</div>
</div>
</section>
<!-- Action Buttons -->
<div class="space-y-4">
<button class="w-full bg-[#e49f53] text-white font-bold py-5 rounded-full shadow-xl shadow-primary-container/20 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span>Siguiente</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
<button class="w-full py-4 text-on-surface font-medium text-sm hover:underline active:scale-95 transition-transform">
            Regresar
        </button>
</div>
</main>
</body></html>

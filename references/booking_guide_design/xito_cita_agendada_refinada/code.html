<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "inverse-primary": "#ffb86c",
              "surface-container-highest": "#e4e2de",
              "surface-tint": "#885208",
              "surface-bright": "#fbf9f5",
              "surface-variant": "#e4e2de",
              "inverse-on-surface": "#f2f0ed",
              "secondary-fixed": "#e9e1dc",
              "on-secondary-container": "#67625e",
              "surface": "#fbf9f5",
              "on-primary": "#ffffff",
              "secondary-fixed-dim": "#cdc5c0",
              "secondary": "#635d5a",
              "on-secondary-fixed-variant": "#4b4642",
              "error": "#ba1a1a",
              "on-error": "#ffffff",
              "outline": "#847466",
              "primary-container": "#e49f53",
              "on-tertiary": "#ffffff",
              "primary-fixed-dim": "#ffb86c",
              "on-error-container": "#93000a",
              "primary": "#885208",
              "surface-dim": "#dbdad6",
              "on-tertiary-fixed": "#1c1b1a",
              "on-secondary": "#ffffff",
              "tertiary-fixed": "#e5e2df",
              "tertiary-container": "#b0adaa",
              "surface-container-low": "#f5f3ef",
              "on-background": "#1b1c1a",
              "on-surface-variant": "#524438",
              "on-primary-fixed-variant": "#683c00",
              "on-tertiary-fixed-variant": "#484745",
              "tertiary-fixed-dim": "#c9c6c3",
              "primary-fixed": "#ffdcbc",
              "on-secondary-fixed": "#1e1b18",
              "secondary-container": "#e6ded9",
              "error-container": "#ffdad6",
              "tertiary": "#605e5c",
              "outline-variant": "#d6c3b3",
              "on-primary-fixed": "#2c1600",
              "background": "#fbf9f5",
              "on-primary-container": "#603700",
              "surface-container-high": "#eae8e4",
              "inverse-surface": "#30312e",
              "surface-container-lowest": "#ffffff",
              "on-surface": "#1b1c1a",
              "on-tertiary-container": "#42413f",
              "surface-container": "#efeeea"
            },
            fontFamily: {
              "headline": ["Inter", "sans-serif"],
              "body": ["Inter", "sans-serif"],
              "label": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar Component (Based on Shared Components JSON) -->
<header class="bg-[#FDFBF7] flex items-center justify-between px-6 h-16 w-full border-b border-stone-200 sticky top-0 z-50">
<div class="flex items-center justify-center w-full relative">
<span class="absolute left-0 p-2 text-stone-500 hover:bg-stone-100 transition-colors rounded-full cursor-pointer">
<span class="material-symbols-outlined block" data-icon="close">close</span>
</span>
<h1 class="text-xl font-semibold tracking-wide text-[#e49f53] font-headline"></h1>
</div>
</header>
<main class="flex-grow flex flex-col items-center px-6 pt-12 pb-8 max-w-md mx-auto w-full">
<!-- Success Animation/Icon Area -->
<div class="mb-8 flex flex-col items-center">
<div class="w-24 h-24 bg-primary-container/10 rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary-container text-6xl" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="text-2xl font-bold text-on-surface text-center mb-2">¡Todo listo, Ana!</h2>
<p class="text-on-surface-variant text-center">Tu cita ha sido agendada con éxito.</p>
</div>
<!-- Appointment Summary Card -->
<div class="w-full bg-surface-container-low rounded-xl p-6 border border-outline-variant/30 shadow-sm mb-8">
<div class="flex flex-col mb-6 border-b border-outline-variant/20 pb-4"><span class="text-[10px] font-bold text-outline uppercase tracking-widest mb-1">NOMBRE</span><span class="text-on-surface font-semibold text-lg">Ana Garcia</span></div>
<div class="space-y-4">
<div class="flex items-start gap-4">
<div class="bg-primary-container/10 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary text-xl" data-icon="calendar_today">calendar_today</span>
</div>
<div>
<p class="text-xs text-on-surface-variant">Fecha</p>
<p class="font-medium">Lunes, 3 de agosto de 2026</p>
</div>
</div>
<div class="flex items-start gap-4">
<div class="bg-primary-container/10 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary text-xl" data-icon="schedule">schedule</span>
</div>
<div>
<p class="text-xs text-on-surface-variant">Hora</p>
<p class="font-medium">09:00 AM</p>
</div>
</div>
<div class="flex items-start gap-4">
<div class="bg-primary-container/10 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary text-xl" data-icon="call">call</span>
</div>
<div>
<p class="text-xs text-on-surface-variant">Teléfono</p>
<p class="font-medium">322 216 6571</p>
</div>
</div>
</div>
</div>
<!-- Notification Note -->
<div class="flex items-start gap-3 bg-surface-container-highest/50 p-4 rounded-lg w-full mb-8">
<span class="material-symbols-outlined text-secondary text-xl" data-icon="chat">chat</span>
<p class="text-sm text-on-secondary-fixed-variant leading-relaxed">
                Recibirás un recordatorio por <span class="font-semibold">WhatsApp</span> un día antes de tu cita.
            </p>
</div>
<!-- Spacer for push-to-bottom layout on mobile if needed -->
<div class="flex-grow"></div>
<!-- Primary Action Button -->
<div class="w-full pt-4"><button class="w-full bg-[#e49f53] text-white font-bold py-5 rounded-full shadow-xl shadow-primary-container/20 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"><span>Enviar confirmación por WhatsApp</span><span class="material-symbols-outlined text-lg">check_circle</span></button><button class="w-full py-4 mt-4 text-on-surface font-medium text-sm hover:underline flex items-center justify-center gap-2 active:scale-95 transition-transform"><span class="material-symbols-outlined text-xl">home</span>Volver al inicio</button></div>
</main>
<!-- Content Footer (Empty for this focused screen) -->
<footer class="h-8"></footer>
</body></html>

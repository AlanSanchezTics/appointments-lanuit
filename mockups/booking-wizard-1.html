<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Paso 1: Agendar Cita</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#B67362", // Dusty Rose
                        "background-light": "#FDF9F6", // Cream
                        "background-dark": "#1A1614", // Darker coffee tone
                        "accent-gold": "#D4AF37",
                        "soft-border": "#E8DED6"
                    },
                    fontFamily: {
                        display: ["Playfair Display", "serif"],
                        sans: ["Plus Jakarta Sans", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "1rem",
                        'xl': '1.5rem',
                        '2xl': '2rem',
                    },
                },
            },
        };
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply font-sans;
            }
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4">
    <div
        class="w-full max-w-[400px] bg-white dark:bg-neutral-900 rounded-[3rem] shadow-2xl overflow-hidden border-[8px] border-neutral-100 dark:border-neutral-800 relative">
        <div class="h-10 flex justify-between items-center px-8 pt-4">
            <span class="text-xs font-semibold dark:text-white">9:41</span>
            <div class="flex gap-1.5 items-center text-neutral-800 dark:text-white">
                <span class="material-symbols-outlined text-[16px]">signal_cellular_alt</span>
                <span class="material-symbols-outlined text-[16px]">wifi</span>
                <span class="material-symbols-outlined text-[16px]">battery_full</span>
            </div>
        </div>
        <div class="p-6 space-y-6">
            <header class="space-y-4">
                <div class="flex justify-between items-center">
                    <div>
                        <span class="text-[10px] uppercase tracking-[0.2em] text-primary font-bold mb-1 block">Paso 1 de
                            3</span>
                        <h1 class="text-3xl font-display text-neutral-800 dark:text-neutral-100">Agendar Cita</h1>
                    </div>
                    <button
                        class="w-10 h-10 rounded-full border border-soft-border dark:border-neutral-700 flex items-center justify-center text-neutral-600 dark:text-neutral-300">
                        <span class="material-symbols-outlined">calendar_month</span>
                    </button>
                </div>
                <div class="w-full h-1 bg-neutral-100 dark:bg-neutral-800 rounded-full overflow-hidden">
                    <div class="w-1/3 h-full bg-primary rounded-full"></div>
                </div>
            </header>
            <section>
                <div class="flex justify-between items-baseline mb-4">
                    <h2 class="text-xs uppercase tracking-widest text-neutral-400 font-bold">Días Disponibles</h2>
                    <span class="text-sm font-medium text-neutral-700 dark:text-neutral-300">Marzo 2024</span>
                </div>
                <div class="flex overflow-x-auto no-scrollbar gap-3 pb-2">
                    <button
                        class="flex-shrink-0 w-16 h-20 rounded-2xl flex flex-col items-center justify-center border border-soft-border dark:border-neutral-800 bg-stone-50/50 dark:bg-neutral-800/50">
                        <span class="text-[10px] font-bold text-neutral-400">LUN</span>
                        <span class="text-lg font-display text-neutral-700 dark:text-neutral-300">04</span>
                    </button>
                    <button
                        class="flex-shrink-0 w-16 h-20 rounded-2xl flex flex-col items-center justify-center border border-soft-border dark:border-neutral-800 bg-stone-50/50 dark:bg-neutral-800/50">
                        <span class="text-[10px] font-bold text-neutral-400">MAR</span>
                        <span class="text-lg font-display text-neutral-700 dark:text-neutral-300">05</span>
                    </button>
                    <button
                        class="flex-shrink-0 w-16 h-20 rounded-2xl flex flex-col items-center justify-center bg-primary shadow-lg shadow-primary/20">
                        <span class="text-[10px] font-bold text-white/70">MIE</span>
                        <span class="text-xl font-display text-white">06</span>
                    </button>
                    <button
                        class="flex-shrink-0 w-16 h-20 rounded-2xl flex flex-col items-center justify-center border border-soft-border dark:border-neutral-800 bg-stone-50/50 dark:bg-neutral-800/50">
                        <span class="text-[10px] font-bold text-neutral-400">JUE</span>
                        <span class="text-lg font-display text-neutral-700 dark:text-neutral-300">07</span>
                    </button>
                    <button
                        class="flex-shrink-0 w-16 h-20 rounded-2xl flex flex-col items-center justify-center border border-soft-border dark:border-neutral-800 bg-stone-50/50 dark:bg-neutral-800/50">
                        <span class="text-[10px] font-bold text-neutral-400">VIE</span>
                        <span class="text-lg font-display text-neutral-700 dark:text-neutral-300">08</span>
                    </button>
                </div>
            </section>
            <section>
                <h2 class="text-xs uppercase tracking-widest text-neutral-400 font-bold mb-4">Selecciona tu horario</h2>
                <div class="grid grid-cols-2 gap-3">
                    <button class="py-4 px-6 rounded-2xl bg-primary text-white font-medium shadow-md">
                        09:00 AM
                    </button>
                    <button
                        class="py-4 px-6 rounded-2xl border border-soft-border dark:border-neutral-800 text-neutral-700 dark:text-neutral-300 font-medium hover:bg-neutral-50 dark:hover:bg-neutral-800 transition-colors">
                        11:00 AM
                    </button>
                    <button
                        class="py-4 px-6 rounded-2xl border border-soft-border dark:border-neutral-800 text-neutral-700 dark:text-neutral-300 font-medium hover:bg-neutral-50 dark:hover:bg-neutral-800 transition-colors">
                        01:00 PM
                    </button>
                    <button
                        class="py-4 px-6 rounded-2xl border border-soft-border dark:border-neutral-800 text-neutral-700 dark:text-neutral-300 font-medium hover:bg-neutral-50 dark:hover:bg-neutral-800 transition-colors">
                        03:00 PM
                    </button>
                </div>
            </section>
            <section class="space-y-4">
                <h2 class="text-xs uppercase tracking-widest text-neutral-400 font-bold">Tus Datos</h2>
                <div class="space-y-4">
                    <div class="relative">
                        <label
                            class="absolute -top-2 left-4 px-1 bg-white dark:bg-neutral-900 text-[10px] font-bold text-primary uppercase"
                            for="name">Nombre completo</label>
                        <input
                            class="w-full px-5 py-4 bg-transparent border-soft-border dark:border-neutral-700 rounded-2xl text-sm focus:ring-primary focus:border-primary dark:text-white dark:placeholder-neutral-600 transition-all outline-none"
                            id="name" placeholder="Ej. Ana García" type="text" />
                    </div>
                    <div class="relative">
                        <label
                            class="absolute -top-2 left-4 px-1 bg-white dark:bg-neutral-900 text-[10px] font-bold text-primary uppercase"
                            for="phone">Teléfono</label>
                        <input
                            class="w-full px-5 py-4 bg-transparent border-soft-border dark:border-neutral-700 rounded-2xl text-sm focus:ring-primary focus:border-primary dark:text-white dark:placeholder-neutral-600 transition-all outline-none"
                            id="phone" placeholder="+52 55 1234 5678" type="tel" />
                    </div>
                </div>
            </section>
            <div class="pt-2">
                <button
                    class="w-full bg-primary hover:bg-[#A06456] text-white py-5 rounded-2xl font-semibold text-lg shadow-xl shadow-primary/30 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2">
                    Siguiente
                    <span class="material-symbols-outlined text-xl">arrow_forward</span>
                </button>
                <p class="text-center text-[11px] text-neutral-400 mt-4">Continuarás a la selección de servicios</p>
            </div>
        </div>
        <div class="h-8 flex items-center justify-center">
            <div class="w-32 h-1.5 bg-neutral-200 dark:bg-neutral-700 rounded-full"></div>
        </div>
    </div>

</body>

</html>

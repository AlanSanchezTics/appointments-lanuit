<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Cita Exitosa - Manicure Booking</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Material+Icons&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#B67362", // Dusty Rose
                        "background-light": "#FDF9F6", // Cream
                        "background-dark": "#1A1614", // Darker coffee tone
                        "accent-gold": "#D4AF37",
                        "soft-border": "#E8DED6"
                    },
                    fontFamily: {
                        display: ["Playfair Display", "serif"],
                        sans: ["Plus Jakarta Sans", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "1rem",
                        'xl': '1.5rem',
                        '2xl': '2rem',
                    },
                },
            },
        };
    </script>
    <style type="text/tailwindcss">
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        h1, h2, .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .bg-cream-gradient {
            background: radial-gradient(circle at center, #FFFFFF 0%, #FDF9F6 100%);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4">
    <div
        class="w-full max-w-[400px] bg-white dark:bg-neutral-900 rounded-[3rem] shadow-2xl overflow-hidden border-[8px] border-neutral-100 dark:border-neutral-800 relative flex flex-col h-[800px]">
        <div class="h-10 flex justify-between items-center px-8 pt-4 shrink-0">
            <span class="text-xs font-semibold dark:text-white">9:41</span>
            <div class="flex gap-1.5 items-center">
                <span class="material-icons text-[16px] dark:text-white">signal_cellular_alt</span>
                <span class="material-icons text-[16px] dark:text-white">wifi</span>
                <span class="material-icons text-[16px] dark:text-white">battery_full</span>
            </div>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center px-8 text-center space-y-8">
            <div class="relative">
                <div class="w-32 h-32 rounded-full bg-primary/10 flex items-center justify-center relative">
                    <div
                        class="w-24 h-24 rounded-full bg-primary/20 flex items-center justify-center animate-pulse absolute">
                    </div>
                    <span class="material-symbols-outlined text-primary text-6xl relative z-10">check_circle</span>
                </div>
                <div class="absolute -top-2 -right-2 w-4 h-4 rounded-full bg-accent-gold/40"></div>
                <div class="absolute -bottom-4 -left-2 w-6 h-6 rounded-full bg-primary/10"></div>
            </div>
            <div class="space-y-4">
                <h1 class="text-4xl font-display text-neutral-800 dark:text-neutral-100 leading-tight">
                    Tu cita ha sido agendada exitosamente
                </h1>
                <p class="text-neutral-500 dark:text-neutral-400 font-sans text-lg italic">
                    muchas gracias
                </p>
            </div>
            <div
                class="w-full bg-background-light dark:bg-neutral-800/50 p-6 rounded-3xl border border-soft-border dark:border-neutral-800 space-y-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-neutral-400 uppercase tracking-widest text-[10px] font-bold">Servicio</span>
                    <span class="text-neutral-700 dark:text-neutral-200 font-medium">Manicura Premium</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-neutral-400 uppercase tracking-widest text-[10px] font-bold">Fecha</span>
                    <span class="text-neutral-700 dark:text-neutral-200 font-medium">Miércoles, 06 Marzo</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-neutral-400 uppercase tracking-widest text-[10px] font-bold">Hora</span>
                    <span class="text-neutral-700 dark:text-neutral-200 font-medium">09:00 AM</span>
                </div>
            </div>
        </div>
        <div class="p-8 space-y-3 shrink-0">
            <button
                class="w-full bg-primary hover:bg-[#A06456] text-white py-5 rounded-2xl font-semibold text-lg shadow-xl shadow-primary/30 transition-all transform active:scale-[0.98]">
                Ver mis citas
            </button>
            <button
                class="w-full py-4 text-neutral-500 dark:text-neutral-400 font-medium hover:text-primary transition-colors text-sm">
                Volver al Inicio
            </button>
        </div>
        <div class="h-8 flex items-center justify-center shrink-0">
            <div class="w-32 h-1.5 bg-neutral-200 dark:bg-neutral-700 rounded-full"></div>
        </div>
    </div>

</body>

</html>
